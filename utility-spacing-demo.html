<!DOCTYPE html>
<html>
<head>
<title>Utility - Spacing</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<!-- Bootstrap 4 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>
.container {
  margin-top: 30px;
}
</style>

</head>
<body>

<div class="container">

  <div class="pt-4 text-white bg-secondary">
    Top padding (1.5rem = 24px)
  </div>

  <div class="p-5 text-white bg-danger">
    Padding on all sides (3rem = 48px)
  </div>

  <div class="m-5 pb-5 text-white bg-success">
    Margin on all sides (3rem = 48px) &amp; bottom padding (3rem = 48px)
  </div>

</div>

</body>
</html>
