<!DOCTYPE html>
<html>
<head>
<title>Utility - Shadow</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<!-- Bootstrap 4 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>
.container {
  margin-top: 30px;
}
</style>

</head>
<body>

<div class="container">
  <h2>Shadows</h2>
  <div class="shadow-none p-3 mb-5 bg-light">No shadow uses the .shadow-none class.</div>
  <div class="shadow-sm p-3 mb-5 bg-white">Small shadow uses the .shadow-sm class.</div>
  <div class="shadow p-3 mb-5 bg-white">Regular shadow uses the .shadow class.</div>
  <div class="shadow-lg p-3 mb-5 bg-white">Larger shadow uses the .shadow-lg class.</div>
</div>

</body>
</html>
