<!DOCTYPE html>
<html>
<head>
<title>Grid System - No Screen Size</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<!-- Bootstrap 4 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>
.grid_system {
  margin-top: 30px;
}
.grid_system div[class^="col"] {
  border: 1px solid white;
  background: #e4dcdc;
  text-align: center;
  padding-top: 5px;
  padding-bottom: 5px
}
</style>

</head>
<body>

<div class="container grid_system">
  <div class="row">
    <div class="col">.col</div>
    <div class="col">.col</div>
    <div class="col">.col</div>
  </div>
  <div class="row">
    <div class="col">.col</div>
    <div class="col">.col</div>
  </div>
</div>

</body>
</html>
